<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nothing leaves the page: scripts and requests are limited to this site,
     no worker, font, frame source or plugin is allowed, and the report frame
     (srcdoc, sandboxed) only runs its own script, allowed by its hash. See
     docs/design/web-security.md. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' {{REPORT_SCRIPT_HASH}}; worker-src 'none'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'none'; frame-src 'none'; object-src 'none'; manifest-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
<meta http-equiv="x-dns-prefetch-control" content="off">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Capisci il tuo cedolino: cedolo legge i PDF sul tuo dispositivo, controlla i totali e spiega ogni voce.">
<title>cedolo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 8h14v16H9z' fill='%23fff'/%3E%3Cpath d='M12 12h8M12 16h8M12 20h5' stroke='%232a78d6' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
<script src="wasm_exec.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="bar">
  <div class="wrap bar-inner">
    <span class="brand">cedolo</span>
    <div class="lang" role="group" data-t-aria="web.language">
      <button type="button" data-lang="it">IT</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="intro" id="intro">
    <h1 data-t="web.heading"></h1>
    <p class="lead" data-t="web.lead"></p>
    <p class="private" data-t="web.private"></p>
  </section>

  <section id="pick">
    <label class="drop" id="drop" for="files">
      <input type="file" id="files" accept="application/pdf,.pdf" multiple disabled>
      <span class="drop-title" data-t="web.drop"></span>
      <span class="drop-choose" data-t="web.choose"></span>
      <span class="drop-hint" data-t="web.drop.hint"></span>
    </label>
    <form class="password" id="pw-form" hidden>
      <p class="pw-title" id="pw-title"></p>
      <p class="pw-hint" data-t="web.password.hint"></p>
      <p class="pw-error" id="pw-error" role="alert" hidden data-t="web.password.wrong"></p>
      <div class="pw-row">
        <input type="password" id="pw-input" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button type="submit" class="primary" data-t="web.password.open"></button>
        <button type="button" id="pw-skip" data-t="web.password.skip"></button>
      </div>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="result" hidden>
    <div class="toolbar">
      <button type="button" class="primary" id="download" data-t="web.download"></button>
      <button type="button" id="restart" data-t="web.restart"></button>
    </div>
    <details class="files" id="files-box">
      <summary data-t="web.files"></summary>
      <ul id="file-list"></ul>
    </details>
    <section class="anon" id="anon" hidden aria-labelledby="anon-title">
      <h2 id="anon-title"></h2>
      <p data-t="web.anon.lead"></p>
      <label class="check"><input type="checkbox" id="anon-amounts" checked> <span data-t="web.anon.amounts"></span></label>
      <p class="anon-warning" id="anon-warning" data-t="web.anon.warning"></p>
      <p class="anon-review" data-t="web.anon.review"></p>
      <pre id="anon-text" tabindex="0"></pre>
      <p class="anon-error" id="anon-error" role="alert" hidden data-t="web.anon.leak"></p>
      <div class="toolbar">
        <button type="button" class="primary" id="anon-download" data-t="web.anon.download"></button>
        <button type="button" id="anon-close" data-t="web.anon.close"></button>
      </div>
    </section>
    <p class="notice" id="none" hidden data-t="web.none"></p>
    <p class="notice" id="too-many" hidden></p>
    <iframe id="report" title="Report" sandbox="allow-scripts" hidden></iframe>
  </section>
</main>

<footer class="wrap foot">
  <p data-t="report.disclaimer"></p>
  <p><a href="https://github.com/danielededo/cedolo" rel="noreferrer" data-t="web.source"></a> · AGPL-3.0 · <span id="version"></span></p>
</footer>
</body>
</html>
