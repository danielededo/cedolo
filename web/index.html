<head>

<body>
<header class="bar">

    <span class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="17" height="23" rx="3" fill="var(--logo-page)"/><path d="M9 9h9M9 13h6" stroke="var(--logo-line)" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="19" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.6"/><path d="m23.3 23.3 4.2 4.2" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>cedolo</span>
    <div class="bar-end">
      <div class="lang" role="group" data-t-aria="web.language">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
      </div>

    </div>
  </div>
</header>

<main class="wrap">
  <section class="intro" id="intro">
    <h1 data-t="web.heading"></h1>
    <p class="lead" data-t="web.lead"></p>
    <ul class="features">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-t="web.feature.private"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span data-t="web.feature.check"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h6M8 11h6"/></svg><span data-t="web.feature.explain"></span></li>
    </ul>
  </section>

  <section id="pick">
    <label class="drop" id="drop" for="files">
      <input type="file" id="files" accept="application/pdf,.pdf" multiple disabled>
      <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <span class="drop-title" data-t="web.drop"></span>
      <span class="drop-choose" data-t="web.choose"></span>
      <span class="drop-hint" data-t="web.drop.hint"></span>
      <span class="progress" id="progress" hidden><span class="progress-bar" id="progress-bar"></span></span>
    </label>
    <form class="password" id="pw-form" hidden>
      <p class="pw-title" id="pw-title"></p>
      <p class="pw-hint" data-t="web.password.hint"></p>
      <p class="pw-error" id="pw-error" role="alert" hidden data-t="web.password.wrong"></p>
      <div class="pw-row">
        <input type="password" id="pw-input" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button type="submit" class="primary" data-t="web.password.open"></button>
        <button type="button" id="pw-skip" data-t="web.password.skip"></button>
      </div>
    </form>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section id="result" hidden>
    <div class="toolbar">
      <button type="button" class="primary" id="download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-t="web.download"></span></button>
      <button type="button" id="restart" data-t="web.restart"></button>
    </div>
    <details class="files" id="files-box">
      <summary data-t="web.files"></summary>
      <ul id="file-list"></ul>
      <button type="button" class="link" id="anon-ask" hidden data-t="web.anon.ask"></button>
    </details>
    <section class="anon" id="anon" hidden aria-labelledby="anon-title">
      <h2 id="anon-title"></h2>
      <p><span data-t="web.anon.lead"></span> <a href="https://github.com/danielededo/cedolo/issues/new?template=misread.yml" rel="noreferrer" target="_blank" data-t="web.anon.report"></a></p>
      <label class="check"><input type="checkbox" id="anon-amounts" checked> <span data-t="web.anon.amounts"></span></label>
      <p class="anon-warning" id="anon-warning" data-t="web.anon.warning"></p>
      <p class="anon-review" data-t="web.anon.review"></p>
      <pre id="anon-text" tabindex="0"></pre>
      <p class="anon-error" id="anon-error" role="alert" hidden data-t="web.anon.leak"></p>
      <div class="toolbar">
        <button type="button" class="primary" id="anon-download" data-t="web.anon.download"></button>
        <button type="button" id="anon-close" data-t="web.anon.close"></button>
      </div>
    </section>
    <p class="notice" id="none" hidden data-t="web.none"></p>
    <p class="notice" id="too-many" hidden></p>
    <div class="skeleton" id="skeleton" hidden aria-hidden="true">
      <span class="sk sk-title"></span><span class="sk sk-line"></span>
      <span class="sk sk-big"></span><span class="sk sk-bar"></span>
      <span class="sk sk-row"></span><span class="sk sk-row"></span><span class="sk sk-row"></span>
    </div>
    <iframe id="report" title="Report" sandbox="allow-scripts" hidden></iframe>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p class="disclaimer" data-t="report.disclaimer"></p>
    <div class="foot-row">
      <span class="brand small"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="17" height="23" rx="3" fill="var(--logo-page)"/><path d="M9 9h9M9 13h6" stroke="var(--logo-line)" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="19" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.6"/><path d="m23.3 23.3 4.2 4.2" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>cedolo <span id="version"></span></span>

    </div>
  </div>
</footer>
</body>
</html>
