# Dependabot base configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This template is language-agnostic, so only the GitHub Actions ecosystem is
# enabled (it applies to any repo with workflows). When the project picks a
# stack, add the matching ecosystem block — examples below.

version: 2

updates:
  # Keep GitHub Actions in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"

