# Dependabot base configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# GitHub Actions, Go modules and the web app's npm packages are kept up to
# date weekly.

version: 2

updates:
  # Keep GitHub Actions in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "*"

  # Keep Go module dependencies up to date.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      go:
        patterns:
          - "*"

  # Keep pdf.js, the web app's only npm dependency, up to date.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
