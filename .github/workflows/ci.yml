name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install poppler (reference PDF reader used in tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Vet the WebAssembly build
        run: GOOS=js GOARCH=wasm go vet ./cmd/cedolo-wasm

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: Test
        run: go test -race ./...

      - name: Scan for personal identifiers
        run: go run ./cmd/piiscan .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pdf.js
        run: npm ci --omit=optional --ignore-scripts
        working-directory: web

      - name: Build the web app
        run: go run ./cmd/webbuild -o dist/web

      - name: Test that the web app reads payslips as the CLI does
        run: npm test
        working-directory: web

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Test the web app in a browser
        run: npm run test:e2e
        working-directory: web
