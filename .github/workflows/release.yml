name: Release

# Pushing a tag vX.Y.Z on main builds cedolo for Linux, macOS and Windows and
# publishes a GitHub Release with the binaries and the changelog section.
# Running the workflow by hand on main with a version does the same, creating
# the tag on the current commit of main first.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like v1.2.3"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run the workflow on main"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "cedolo $TAG"
          git push origin "refs/tags/$TAG"

      - name: Check the tag is on main and in the changelog
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Test
        run: go test ./...

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Build
        run: |
          mkdir dist
          (cd web && npm ci --omit=optional --ignore-scripts)
          go run ./cmd/webbuild -o "cedolo-web_${TAG}" -version "$TAG"
          zip -qr "dist/cedolo-web_${TAG}.zip" "cedolo-web_${TAG}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="cedolo_${TAG}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir "$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.buildVersion=${TAG}" \
              -o "$name/cedolo$ext" ./cmd/cedolo
            cp LICENSE README.md CHANGELOG.md "$name/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "cedolo $TAG" --notes-file notes.md --verify-tag
