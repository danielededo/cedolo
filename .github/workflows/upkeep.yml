name: Upkeep

# Once a month, opens an issue for each piece of built-in data that is due
# a check: the figures set by law once a new year starts, and the CNEL
# contract list once its export is old (see cmd/upkeep). An issue already
# open with the same title is not opened again.

on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upkeep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Open an issue for what is due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/upkeep > due.tsv
          while IFS=$'\t' read -r title body; do
            [ -n "$title" ] || continue
            open="$(gh issue list --state open --search "in:title \"$title\"" --json title --jq '.[].title')"
            if printf '%s\n' "$open" | grep -qxF "$title"; then
              echo "already open: $title"
              continue
            fi
            gh issue create --title "$title" --body "$body"
          done < due.tsv
