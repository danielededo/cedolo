name: Web app

# Builds the web app and publishes it with GitHub Pages. Run it by hand once
# Pages is enabled for the repository (Settings > Pages > Source: GitHub
# Actions).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: |
          (cd web && npm ci --omit=optional)
          go run ./cmd/webbuild -o dist/web -version "$(git describe --tags --always)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

      - id: deployment
        uses: actions/deploy-pages@v5
