name: Web app

# Builds the web app of the latest release and publishes it with GitHub Pages
# (Settings > Pages > Source: GitHub Actions): after a Release run, or when
# run by hand. The app online is always a released version, the same as the
# binaries and the web app attached to the release; main only reaches it
# with the next release.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the tags.
          fetch-depth: 0

      - name: Check out the latest release
        run: |
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/main)"
          git checkout --detach "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build
        run: |
          (cd web && npm ci --omit=optional --ignore-scripts)
          # The page allows its own build folder on the site, not every
          # project there (docs/design/web-security.md).
          go run ./cmd/webbuild -o dist/web -version "$TAG" -url "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
